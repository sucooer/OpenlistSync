<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<title>OpenList Sync</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23007aff'/%3E%3Cpath d='M28 66l10 -22 12 18 8 -11 14 15' stroke='white' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18M3 12h18M3 16h18"/><circle cx="8" cy="8" r="2.2" fill="#fff" stroke="none"/><circle cx="16" cy="12" r="2.2" fill="#fff" stroke="none"/><circle cx="8" cy="16" r="2.2" fill="#fff" stroke="none"/></svg>
      </div>
      <div class="brand-text">
        <strong>OpenList Sync</strong>
        <span>同步管理</span>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item" data-view="overview">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        <span>概览</span>
      </button>
      <button class="nav-item" data-view="connections">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        <span>连接</span>
      </button>
      <button class="nav-item" data-view="tasks">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span>任务</span>
      </button>
      <button class="nav-item" data-view="logs">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
        <span>日志</span>
      </button>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>设置</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="conn-status" id="sidebar-status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">加载中…</span>
      </div>
      <div class="version"><span id="version"></span></div>
    </div>
  </aside>

  <main class="content">
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 6h17M3.5 12h17M3.5 18h17"/></svg>
        </button>
        <div class="page-title">
          <h1 id="page-title">概览</h1>
        </div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

<div id="sheet-backdrop" class="sheet-backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" id="sheet-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<div id="confirm-backdrop" class="sheet-backdrop confirm" hidden>
  <div class="sheet confirm-sheet" role="dialog" aria-modal="true">
    <h2 id="confirm-title">确认删除</h2>
    <p id="confirm-text">确定要删除吗？</p>
    <div class="confirm-actions">
      <button class="btn" id="confirm-cancel">取消</button>
      <button class="btn btn-danger" id="confirm-ok">删除</button>
    </div>
  </div>
</div>

<div id="dir-backdrop" class="sheet-backdrop confirm" hidden>
  <div class="sheet dir-sheet" role="dialog" aria-modal="true">
    <h2 id="dir-title">选择目录</h2>
    <div class="dir-crumb" id="dir-crumb"></div>
    <div class="dir-list" id="dir-list"></div>
    <div class="confirm-actions">
      <button class="btn" id="dir-cancel">取消</button>
      <button class="btn btn-primary" id="dir-pick">选择此目录</button>
    </div>
  </div>
</div>

<div id="login-backdrop" class="sheet-backdrop confirm" hidden>
  <div class="sheet confirm-sheet" role="dialog" aria-modal="true">
    <h2>输入访问令牌</h2>
    <p>请输入管理员配置的 API 令牌后访问。</p>
    <input class="field mono" id="login-token" type="password" placeholder="粘贴 API 令牌" autocomplete="off" style="margin-top:16px">
    <div class="confirm-actions" style="justify-content:center">
      <button class="btn" id="login-cancel">取消</button>
      <button class="btn btn-primary" id="login-ok">确定</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
