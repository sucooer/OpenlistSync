name: docker-build-push

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  docker-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check if version file changed
        id: version_check
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -q "^version$"; then
              echo "changed=true" >> $GITHUB_ENV
            else
              echo "changed=false" >> $GITHUB_ENV
            fi
          else
            echo "changed=true" >> $GITHUB_ENV
          fi

      - name: Get version from file
        run: |
          echo "version=$(cat version)" >> $GITHUB_ENV

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        if: env.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openlist-sync:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/openlist-sync:${{ env.version }}
          push: true

      - name: Skip push notification
        if: env.changed != 'true'
        run: echo "version file not changed, skipping Docker push"