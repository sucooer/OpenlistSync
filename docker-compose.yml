services:
  openlist-sync:
    image: anyear/openlist-sync:latest
    container_name: openlist-sync
    restart: unless-stopped
    ports:
      # 主机侧监听 0.0.0.0:18222(包含公网可达)。
      # 必须设置 WEB_API_TOKEN：容器入口脚本会在非环回绑定但 token 为空时直接拒绝启动。
      # 若仅自用(局域网或本机访问)，把这里改回 "127.0.0.1:18222:18222" 并可以清空 token。
      - "18222:18222"
    volumes:
      # 数据与配置统一放宿主机 ./data:UI 配置存 ./data/openlist-sync.json,
      # 任务同步目录也在此,重建容器不丢。
      # 容器启动时自动将本目录属主修正为 uid 10001,无需手动 chown。
      - ./data:/data
    environment:
      # 容器内监听全接口；宿主机侧暴露范围由上方 ports 控制。
      # WEB_LISTEN 默认 127.0.0.1:18222；这里改成 ":18222" 表示容器内全接口。
      # 二进制直接运行时：默认仅监听 127.0.0.1，无需设置此项。
      WEB_LISTEN: ":18222"
      # API Token 必填项——宿主端口已对公网可达，将为空或未设时报错。
      # 复制 .env.example 为 .env 并在其中设 WEB_API_TOKEN=<你的令牌>。
      WEB_API_TOKEN: ${WEB_API_TOKEN:?set WEB_API_TOKEN in .env before starting}